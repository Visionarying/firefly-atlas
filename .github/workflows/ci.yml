name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Type check
        working-directory: web
        run: npm run type-check
      - name: Build frontend
        working-directory: web
        run: npm run build

  service:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: service/go.sum
      - name: Stub the embedded SPA
        # router.go declares `//go:embed all:webdist`, but webdist is a build
        # artifact and is git-ignored, so it does not exist on a fresh checkout.
        # The Dockerfile fills it with the real Vite bundle; a placeholder is
        # enough for vet and build to succeed here.
        working-directory: service
        run: |
          mkdir -p router/webdist
          printf '<!doctype html><title>firefly-atlas ci stub</title>\n' > router/webdist/index.html
      - name: Vet
        working-directory: service
        run: go vet ./...
      - name: Build
        working-directory: service
        run: go build -trimpath -o /tmp/firefly-atlas .
