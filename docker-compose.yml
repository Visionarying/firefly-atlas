name: firefly-atlas

services:
  firefly-atlas:
    # 直接用 GitHub Actions 构建好的镜像，不需要本地安装 Go / Node。
    # 想跟随最新提交可改成 ghcr.io/visionarying/firefly-atlas:latest
    image: ghcr.io/visionarying/firefly-atlas:1.3.2
    container_name: firefly-atlas
    restart: unless-stopped
    ports:
      # 冒号左边是宿主端口，被占用时改成 "13002:3002"
      - "3002:3002"
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/data
      PORT: "3002"
      # 只在首次初始化时生效；想指定初始密码就取消注释并修改。
      # ADMIN_PASSWORD: "change-me"
    volumes:
      # database.db、uploads/、logs/ 全在这里；备份时整个复制即可。
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
